# The site is static HTML in v2-static, built by build.py and copied by deploy.sh; both
# refuse a forbidden phrase (check_phrases.py). This job runs the same check on every push.
name: forbidden phrases
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 v2-static/check_phrases.py
