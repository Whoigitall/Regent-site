  else { shot.classList.add('hide'); shot.classList.remove('on'); tag.classList.add('hide'); noshot.classList.remove('hide'); noshot.querySelector('b').textContent=s.none[0]; noshot.querySelector('span').textContent=s.none[1]; }

function restart(){ clearTimeout(timer); if(playing) timer=setTimeout(()=>go(i+1), DWELL); }
